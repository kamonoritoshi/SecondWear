<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Test Đăng nhập & Thanh toán PayOS</title>
<style>
body {
	font-family: sans-serif;
	max-width: 600px;
	margin: auto;
	padding: 20px;
}

input, select {
	width: 100%;
	margin: 8px 0;
	padding: 8px;
}

button {
	padding: 10px 20px;
	margin: 10px 5px 20px 0;
}

.result {
	margin-top: 15px;
	white-space: pre-wrap;
	color: green;
}

.error {
	color: red;
}

.section {
	margin-top: 40px;
	border-top: 1px solid #ccc;
	padding-top: 20px;
}

.flex {
	display: flex;
	align-items: center;
	gap: 8px;
	margin: 8px 0;
}
</style>
</head>
<body>
	<h2>Đăng nhập</h2>

	<label>Email:</label>
	<input type="email" id="email" placeholder="test@example.com" />

	<label>Password:</label>
	<input type="password" id="password" placeholder="Nhập mật khẩu" />

	<label>Vai trò:</label>
	<select id="roleName">
		<option value="customer">Customer</option>
		<option value="seller">Seller</option>
		<option value="admin">Admin</option>
	</select>

	<div class="flex">
		<input type="checkbox" id="rememberMe" /> <label for="rememberMe">Ghi
			nhớ đăng nhập</label>
	</div>

	<div>
		<button onclick="login()">Đăng nhập</button>
	</div>

	<div id="loginResult" class="result"></div>

	<div class="section">
		<h2>Danh sách đơn hàng đang xử lý</h2>
		<button onclick="loadOrders()">Tải đơn hàng</button>

		<label for="orderSelect">Chọn đơn hàng:</label> <select
			id="orderSelect">
			<option value="">-- Vui lòng tải danh sách --</option>
		</select>

		<button onclick="paySelectedOrder()">Thanh toán PayOS</button>

		<div id="payResult" class="result"></div>
	</div>

	<script>
    const BASE_AUTH = 'http://localhost:8080/api/auth';
    const BASE_PAYMENT = 'http://localhost:8080/api/payment';
    const BASE_ORDER = 'http://localhost:8080/api/orders';

    async function login() {
      const payload = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value.trim(),
        rememberMe: document.getElementById('rememberMe').checked || false,
        roleName: document.getElementById('roleName').value
      };

      const res = await fetch(`${BASE_AUTH}/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      const loginResult = document.getElementById('loginResult');

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('jwt', data.token);
        loginResult.textContent = `Đăng nhập thành công!\nToken đã được lưu.`;
        loginResult.className = "result";
        console.log("JWT Token đang dùng:", data.token);
      } else {
        const text = await res.text();
        loginResult.textContent = `Đăng nhập thất bại: ${text}`;
        loginResult.className = "result error";
      }
    }

    async function loadOrders() {
      const token = localStorage.getItem('jwt');
      const res = await fetch(`${BASE_ORDER}/processing`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      const select = document.getElementById('orderSelect');
      select.innerHTML = ''; // clear

      if (res.ok) {
        const orders = await res.json();
        if (orders.length === 0) {
          const opt = document.createElement('option');
          opt.text = "Không có đơn hàng đang xử lý";
          opt.disabled = true;
          select.appendChild(opt);
          return;
        }

        orders.forEach(order => {
          const opt = document.createElement('option');
          opt.value = order.orderId;
          opt.text = `Đơn hàng #${order.orderId} - ${order.totalAmount} VND`;
          select.appendChild(opt);
        });
      } else {
        alert("Không thể tải danh sách đơn hàng.");
      }
    }

    async function paySelectedOrder() {
      const token = localStorage.getItem('jwt');
      const orderId = document.getElementById('orderSelect').value;
      const payResult = document.getElementById('payResult');

      if (!orderId) {
        alert("Vui lòng chọn đơn hàng.");
        return;
      }

      const url = `${BASE_PAYMENT}/payos/create?orderId=${orderId}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!res.ok) {
          const text = await res.text();
          payResult.textContent = `Lỗi tạo thanh toán: ${text}`;
          return;
        }

        const checkoutUrl = await res.text();
        payResult.textContent = `Chuyển hướng đến PayOS...\n${checkoutUrl}`;
        setTimeout(() => window.open(checkoutUrl, "_blank"), 1500);
      } catch (err) {
        payResult.textContent = `Lỗi kết nối: ${err}`;
      }
    }
 // Hiển thị kết quả trả về từ PayOS nếu có
    window.addEventListener("DOMContentLoaded", function () {
      const result = localStorage.getItem('payos_result');
      if (result) {
        const div = document.createElement('div');
        div.className = "section";
        div.innerHTML = `<h2>Kết quả thanh toán từ PayOS:</h2><pre>${result}</pre>`;
        document.body.appendChild(div);
        localStorage.removeItem('payos_result');
      }
    });
  </script>
</body>
</html>
